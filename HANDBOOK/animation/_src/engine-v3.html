<title>{{TITLE}}</title>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root{
    color-scheme: dark;
    --page:#0b1826; --stage:#10263a; --card:#16324a; --line:#2a4d6b;
    --ink:#eef3f7; --mut:#9db3c6; --gold:#f4b942; --teal:#39c0c8; --pink:#ef8fc6;
    --coral:#ff8a5b; --violet:#a996ff; --red:#ff5d6c; --green:#5ad18a;
    --sans:'Noto Sans TC','Microsoft JhengHei','PingFang TC',system-ui,sans-serif;
    --mono:'JetBrains Mono',Consolas,'Courier New',monospace;
  }
  *{box-sizing:border-box}
  html,body{background:var(--page);color:var(--ink)}
  body{font-family:var(--sans);font-size:18px;line-height:1.6;margin:0}
  /* ===== 版面（RWD）：標題＋導覽＋舞台＋字幕＋控制列，盡量塞進同一個螢幕畫面 =====
     舞台寬度（--stage-w）、字幕字級（--sub-fs）、字幕行數（--sub-n）由下方 JS 的 fit() 量完實際高度後設定。
     沒有 JS 時，退回用 100vh 粗估的寬度。 */
  :root{--stage-w:min(100%, calc((100vh - 330px) * 16 / 9));--sub-fs:24px;--sub-n:2;--lab-h:20px}
  .wrap{max-width:1500px;margin:0 auto;padding-inline:16px;padding-block:8px 48px}
  header.top{display:flex;align-items:baseline;gap:2px 14px;margin:0 0 6px;min-width:0}
  header.top h1{flex:none;font-size:clamp(18px,1.45vw,26px);line-height:1.3;font-weight:900;margin:0;letter-spacing:.02em;white-space:nowrap}
  header.top p{flex:1 1 0;min-width:0;margin:0;color:var(--mut);font-size:clamp(12.5px,.85vw,15px);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* 章節膠囊：永遠單行；放不下就橫向捲動（捲軸隱藏、兩端淡出），目前這句所在的膠囊會自動捲到中間 */
  .chips{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:4px;margin:-4px -4px 4px;scrollbar-width:none;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 var(--fl,0px),#000 calc(100% - var(--fr,0px)),transparent 100%);
    mask-image:linear-gradient(90deg,transparent 0,#000 var(--fl,0px),#000 calc(100% - var(--fr,0px)),transparent 100%)}
  .chips::-webkit-scrollbar,.steps::-webkit-scrollbar{display:none}
  .chips button{flex:none;font:inherit;font-size:clamp(13.5px,1.05vw,16px);font-weight:700;line-height:1.35;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 14px;cursor:pointer}
  .chips button[aria-current="true"]{color:#10263a;background:var(--gold);border-color:var(--gold)}
  /* 兩層章節：上排 Step（單行小膠囊）、下排該 Step 的段落 */
  .steps{display:flex;gap:6px;margin:0 0 5px;scrollbar-width:none}
  .steps[hidden]{display:none}
  .steps button{flex:1 1 auto;min-width:0;display:flex;align-items:baseline;justify-content:center;gap:.4em;white-space:nowrap;font:inherit;font-size:clamp(13px,1.02vw,16px);line-height:1.35;color:var(--ink);background:var(--card);border:1px solid var(--line);border-bottom:3px solid var(--c);border-radius:10px;padding:3px 10px 2px;cursor:pointer}
  .steps button b{flex:none;font-size:.92em;font-weight:900;color:var(--c);letter-spacing:.02em}
  .steps button span{min-width:0;overflow:hidden;text-overflow:ellipsis;font-weight:800}
  .steps button[aria-current="true"]{background:#233f59;border-color:var(--c)}
  .steps button:focus-visible{outline:3px solid var(--teal);outline-offset:-1px}
  /* 視窗不夠寬（約 1260px 以下）：沒選到的 Step 只留標籤（Step 3），選到的那顆才顯示完整名稱；滑鼠移上去會顯示全名 */
  @media (max-width:1259px){.steps button:not([aria-current="true"]) span{display:none}}
  .chips button:focus-visible,.ctrl button:focus-visible{outline:3px solid var(--teal);outline-offset:1px}
  .stagebox{position:relative;width:var(--stage-w);max-width:100%;margin:0 auto;background:var(--stage);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  #stage{display:block;width:100%;height:auto}
  .sub{width:var(--stage-w);max-width:100%;margin:8px auto 0;display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
  /* 字幕框：高度固定（--sub-n 行），換句子時畫面不會跳；少數特別長的句子由 fitSubText() 暫時縮字（最小 18px）塞進同一個框 */
  .subline{height:calc(var(--sub-fs) * var(--sub-n) * 1.45 + var(--lab-h) + 16px);overflow:hidden;background:#050d16;border-radius:12px;padding:8px 18px;font-size:var(--sub-cur,var(--sub-fs));font-weight:700;line-height:1.45;text-wrap:pretty;overflow-wrap:anywhere}
  .subline small{display:block;height:18px;margin-bottom:2px;font-size:max(13px,.5em);line-height:18px;font-weight:700;color:var(--gold);letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* 全螢幕（投影用）：舞台＋字幕＋控制列填滿螢幕；尺寸同樣由 fit() 算 */
  .player:fullscreen{background:var(--page);padding:10px 16px;overflow:auto;display:flex;flex-direction:column;justify-content:center}
  .player:fullscreen .stagebox,.player:fullscreen .sub{flex:none}
  .player:fullscreen .hint{display:none}
  .who{display:inline-block;font-size:.62em;font-weight:900;color:#10263a;background:var(--c);border-radius:999px;padding:0 .6em;margin-right:.55em;vertical-align:.16em}
  .who.x{--c:#ff8a5b} .who.z{--c:#39c0c8}
  .bar{height:4px;background:var(--card);border-radius:3px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--gold)}
  /* 控制列：比舞台寬時，以舞台為中心往左右多出去（單行），放不下才折行 */
  .ctrl{justify-self:center;width:max-content;max-width:min(calc(100vw - 24px),1500px);display:flex;flex-wrap:wrap;gap:6px 6px;align-items:center;justify-content:center}
  .ctrl button{font:inherit;font-size:15px;font-weight:700;line-height:1.3;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:5px 9px;cursor:pointer;min-width:44px}
  .ctrl button.main{background:var(--gold);color:#10263a;border-color:var(--gold);min-width:104px}
  .ctrl select{font:inherit;font-size:14.5px;font-weight:700;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:5px 4px;max-width:16em}
  .ctrl label{display:flex;align-items:center;gap:4px;color:var(--mut);font-size:14px;font-weight:700}
  .ctrl select:focus-visible{outline:3px solid var(--teal);outline-offset:1px}
  .ctrl button.off{color:var(--mut);text-decoration:line-through}
  .voicenote{color:var(--gold);font-size:14px;line-height:1.35;text-align:center;margin:0}
  .voicenote[hidden]{display:none}
  .startbtn{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);font:inherit;font-size:clamp(16px,calc(var(--stage-w) / 45),28px);font-weight:900;color:#10263a;background:var(--gold);border:0;border-radius:999px;padding:.6em 1.4em;cursor:pointer;box-shadow:0 8px 30px rgba(0,0,0,.45)}
  .startbtn:focus-visible{outline:4px solid var(--teal);outline-offset:3px}
  .ctrl .pos{color:var(--mut);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:center}
  /* 鍵盤提示：可視區高度 800px 以上才顯示（矮螢幕要把高度讓給舞台） */
  .hint{display:none;color:var(--mut);font-size:14px;line-height:1.35;text-align:center;margin:0}
  @media (min-height:800px){.hint{display:block}}
  @media (max-height:700px){:root{--lab-h:0px}.subline small{display:none}}
  section.after{max-width:1100px;margin:44px auto 0}
  section.after h2{font-size:26px;font-weight:900;margin:0 0 6px;text-wrap:balance}
  section.after > p{color:var(--mut);margin:0 0 16px;max-width:65ch}
  .roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
  .role{background:var(--card);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:12px;padding:14px 16px}
  .role h3{margin:0 0 6px;font-size:20px;color:var(--c)}
  .role ul{margin:0;padding-left:1.2em;font-size:17px}
  .role .out{margin:10px 0 0;font-size:16px;font-weight:700;color:var(--ink);background:#0b1826;border-radius:8px;padding:6px 10px}
  .where{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:17px}
  section.after code{overflow-wrap:anywhere}
  .role,.where{min-width:0}
  .where code{font-family:var(--mono);font-size:15px;color:var(--gold);word-break:break-all}

  #stage text{font-family:var(--sans)}
  #stage .mono{font-family:var(--mono)}
  #stage g,#stage text,#stage path,#stage rect,#stage circle{transition:opacity .6s ease, transform 1.2s cubic-bezier(.45,0,.2,1)}
  #stage .hid{opacity:0}
  #stage.paused *{animation-play-state:paused!important}
  #stage .dim{opacity:.22}
  #stage .draw{stroke-dasharray:1 1;stroke-dashoffset:1;opacity:0;transition:stroke-dashoffset 1.1s ease, opacity .1s}
  #stage .draw.on{stroke-dashoffset:0;opacity:1}
  #stage .glow{animation:glow 1.3s ease-in-out 3}
  @keyframes glow{50%{filter:drop-shadow(0 0 8px #ffffff) drop-shadow(0 0 20px rgba(255,255,255,.55))}}
  #stage .stamp{transform-box:fill-box;transform-origin:center;transition:opacity .3s, transform .45s cubic-bezier(.2,1.5,.4,1)}
  #stage .stamp.hid{transform:scale(1.9)}
  #stage .ping{transform-box:fill-box;transform-origin:center;animation:ping 1.3s ease-out infinite}
  @keyframes ping{from{transform:scale(1);opacity:1}to{transform:scale(3.4);opacity:0}}
  #stage .tcursor{animation:tblink 1.1s steps(1) infinite}
  @keyframes tblink{50%{opacity:0}}
  #stage .mcur{transition:transform 1.1s cubic-bezier(.45,0,.2,1), opacity .4s}
  #stage.instant *{transition:none!important;animation:none!important}

  /* ---- 嵌入模式（被 iframe 嵌入，或網址帶 #embed）---- */
  html.embed header.top, html.embed section.after, html.embed .hint{display:none}
  html.embed .wrap{padding-block:4px 6px}
  html.embed .subline{padding:6px 14px}
  /* ---- 問小港側欄 ---- */
  .askbtn{font:inherit;font-size:16px;font-weight:800;color:#10263a;background:var(--teal);border:0;border-radius:999px;padding:8px 16px;cursor:pointer}
  .askbtn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .askdrawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);background:#0e2133;border-left:1px solid var(--line);box-shadow:-10px 0 40px rgba(0,0,0,.45);display:flex;flex-direction:column;z-index:50;transform:translateX(105%);transition:transform .3s ease}
  .askdrawer.open{transform:none}
  .askhead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .askhead h3{margin:0;font-size:20px;font-weight:900;flex:1}
  .askhead button{font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer}
  .askwhere{font-size:14px;color:var(--gold);padding:8px 16px 0}
  .asklog{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
  .askmsg{border-radius:12px;padding:10px 12px;font-size:16px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
  .askmsg.me{align-self:flex-end;background:var(--gold);color:#10263a;font-weight:700;max-width:85%}
  .askmsg.bot{background:var(--card);border:1px solid var(--line)}
  .askmsg.wait{color:var(--mut)}
  .askjump{display:inline-block;margin:6px 6px 0 0;font:inherit;font-size:14px;font-weight:800;color:#10263a;background:var(--teal);border:0;border-radius:8px;padding:4px 10px;cursor:pointer;white-space:normal;text-align:left}
  .askform{display:flex;gap:8px;padding:12px 16px 16px;border-top:1px solid var(--line)}
  .askform input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:#081522;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .askform button{font:inherit;font-weight:800;background:var(--gold);color:#10263a;border:0;border-radius:10px;padding:0 14px;cursor:pointer}
  .askform input:focus-visible{outline:3px solid var(--teal)}
  .asktips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 8px}
  .asktips button{font:inherit;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer}
  @media (prefers-reduced-motion: reduce){
    #stage *{transition-duration:.01s!important;animation:none!important}
  }
  /* 手機寬度：允許垂直捲動，但不出現水平捲軸 */
  @media (max-width:640px){
    .wrap{padding-inline:10px}
    header.top{flex-wrap:wrap}
    header.top h1{flex:1 1 100%;min-width:0;white-space:normal;font-size:19px}
    header.top p{flex-basis:100%;white-space:normal;font-size:13px}
    .steps{overflow-x:auto}
    .steps button{flex:none;font-size:14px}
    .chips button{font-size:14px}
    .ctrl{width:100%;max-width:100%}
    .ctrl button{padding:7px 10px;font-size:15px}
    .ctrl select{max-width:100%}
    .subline{padding:8px 12px}
  }
  @media (pointer:coarse){.hint{display:none}}
</style>

<div class="wrap">
  <header class="top">
    <h1>{{H1}}</h1>
    <p>{{SUBTITLE}}</p>
  </header>

  <nav class="steps" id="steps" aria-label="課程步驟" hidden></nav>
  <nav class="chips" id="chips" aria-label="章節"></nav>

  <div class="player" id="player">
  <div class="stagebox">
    <svg id="stage" viewBox="0 0 1600 900" role="img" aria-label="{{H1}}動畫畫面">
      <defs id="defs"></defs>
      <rect x="0" y="0" width="1600" height="900" fill="#10263a"></rect>
      <g id="layer"></g>
    </svg>
    <button id="bStart" class="startbtn" type="button">▶ 開始播放（有中文語音）</button>
  </div>

  <div class="sub">
    <div class="subline" id="subline" aria-live="polite"><small id="scenelabel">第 1 段</small><span id="who" class="who" hidden></span><span id="subtext">載入中…</span></div>
    <div class="bar"><i id="barfill"></i></div>
    <div class="ctrl">
      <button id="bPrevScene" type="button" title="上一段">⏮ 上一段</button>
      <button id="bPrev" type="button" title="上一句（←）">◀ 上一句</button>
      <button id="bPlay" type="button" class="main">▶ 播放</button>
      <button id="bNext" type="button" title="下一句（→）">下一句 ▶</button>
      <button id="bNextScene" type="button" title="下一段">下一段 ⏭</button>
      <button id="bVoice" type="button" title="開關語音">🔊 語音：開</button>
      <label for="voiceSel">聲音<select id="voiceSel"><option value="">預設中文</option></select></label>
      <label for="speedSel">速度<select id="speedSel"><option value="0.75">0.75×（慢）</option><option value="1" selected>1×（正常）</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="1.75">1.75×</option><option value="2">2×（快）</option></select></label>
      <button id="bAsk" type="button" class="askbtn" hidden>💬 問小港</button>
      <button id="bFull" type="button" title="全螢幕（F）">⛶ 全螢幕</button>
      <span class="pos" id="pos">1 段</span>
    </div>
    <p class="voicenote" id="voiceNote" hidden></p>
    <p class="hint">空白鍵：暫停／播放　·　← →：上一句／下一句　·　F：全螢幕　·　上面的 Step 和章節可以直接跳　·　速度同時調整語音和字幕</p>
  </div>
  </div>

<!--{{AFTER}}-->
</div>

<aside class="askdrawer" id="askDrawer" aria-label="問小港" aria-hidden="true">
  <div class="askhead"><h3>💬 問小港</h3><button type="button" id="askClose">關閉</button></div>
  <div class="askwhere" id="askWhere"></div>
  <div class="asklog" id="askLog" aria-live="polite"></div>
  <div class="asktips" id="askTips"></div>
  <form class="askform" id="askForm"><label for="askInput" class="sr" hidden>問題</label><input id="askInput" autocomplete="off" placeholder="看不懂的地方直接問，例如：五選一怎麼選？"><button type="submit">送出</button></form>
</aside>
<script>
(function(){
const NS='http://www.w3.org/2000/svg';
const C={bg:'#10263a',ink:'#eef3f7',mut:'#9db3c6',card:'#16324a',card2:'#1c3d59',line:'#2a4d6b',
  gold:'#f4b942',teal:'#39c0c8',pink:'#ef8fc6',coral:'#ff8a5b',violet:'#a996ff',red:'#ff5d6c',green:'#5ad18a',grey:'#7f93a6',blue:'#9fb4ff'};
const svg=document.getElementById('stage'), layer=document.getElementById('layer'), defs=document.getElementById('defs');
let L=layer, instant=false, timers=[];

/* ---------- 繪圖小工具 ---------- */
function mk(tag,a,p){const e=document.createElementNS(NS,tag);for(const k in a){if(a[k]==null)continue;if(k==='text')e.textContent=a[k];else e.setAttribute(k,a[k]);}(p||L).appendChild(e);return e;}
function grp(p,hidden=true,cls=''){return mk('g',{class:((hidden?'hid ':'')+cls).trim()||null},p);}
function T(p,x,y,s,o={}){const size=o.size||34;const t=mk('text',{x,y,'font-size':size,fill:o.fill||C.ink,'text-anchor':o.anchor||'start','font-weight':o.weight||500,class:o.mono?'mono':null},p);String(s).split('\n').forEach((line,i)=>mk('tspan',{x,dy:i?size*1.3:0,text:line},t));return t;}
function R(p,x,y,w,h,o={}){return mk('rect',{x,y,width:w,height:h,rx:o.rx??14,fill:o.fill||C.card,stroke:o.stroke||'none','stroke-width':o.sw||3,'stroke-dasharray':o.dash||null},p);}
function P(p,d,color,o={}){return mk('path',{d,fill:'none',stroke:color,'stroke-width':o.w||6,'stroke-linecap':'round',pathLength:1,class:'draw'},p);}
function box(p,x,y,w,h,label,o={}){const g=grp(p,o.hidden!==false);R(g,x,y,w,h,o);const n=String(label).split('\n').length;const size=o.size||30;T(g,x+w/2,y+h/2-(n-1)*size*0.65+size*0.36,label,{size,anchor:'middle',fill:o.color||C.ink,weight:o.weight||700,mono:o.mono});return g;}
['gold','teal','pink','coral','violet','red','green','grey','mut','blue'].forEach(k=>{const m=mk('marker',{id:'ah-'+k,viewBox:'0 0 10 10',refX:6,refY:5,markerWidth:4,markerHeight:4,orient:'auto-start-reverse'},defs);mk('path',{d:'M0,0 L10,5 L0,10 z',fill:C[k]},m);});
function arrow(p,d,ck,o={}){const g=grp(p,o.hidden!==false);const w=o.w||5;
  if(o.dash)mk('path',{d,fill:'none',stroke:C[ck],'stroke-width':w,'stroke-dasharray':'12 10','stroke-linecap':'round'},g);else P(g,d,C[ck],{w});
  mk('path',{d,fill:'none',stroke:C[ck],'stroke-opacity':0,'stroke-width':w,'marker-end':`url(#ah-${ck})`,class:'hid late'},g);return g;}
function dot(p,x,y,color,label,o={}){const g=grp(p,o.hidden!==false);mk('circle',{cx:x,cy:y,r:o.r||16,fill:color,stroke:C.bg,'stroke-width':5},g);if(label)T(g,x,o.above?y-30:y+50,label,{size:o.size||22,anchor:'middle',fill:o.lf||C.mut,mono:o.mono!==false,weight:500});return g;}
function check(p,x,y,o={}){const g=grp(p,o.hidden!==false);mk('circle',{cx:x,cy:y,r:22,fill:C.green},g);T(g,x,y+11,'✓',{size:30,anchor:'middle',weight:900,fill:C.bg});return g;}
function stamp(p,cx,cy,text,color,o={}){const size=o.size||48;const g=grp(p,true,'stamp');const inner=mk('g',{transform:`rotate(${o.rot??-8} ${cx} ${cy})`},g);
  const lines=String(text).split('\n');const w=o.w||Math.max(...lines.map(l=>l.length))*size+70;const h=o.h||lines.length*size*1.3+34;
  R(inner,cx-w/2,cy-h/2,w,h,{fill:'rgba(5,13,22,.82)',stroke:color,sw:6,rx:10});T(inner,cx,cy-(lines.length-1)*size*0.65+size*0.36,text,{size,anchor:'middle',weight:900,fill:color});return g;}

/* ---------- 放在小港網站上：雲端語音＋問小港 ---------- */
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function jumpLabel(id,sc,st){if(id!==ANIM_ID)return `▶ 另一支動畫：第 ${sc} 段`;const S=scenes[sc-1];return S?`▶ 跳到第 ${sc} 段${st?'・第 '+st+' 句':''}：${S.title}`:null;}
function renderAnswer(text){const box=document.createElement('div');box.className='askmsg bot';
  const jumps=[];const body=String(text).replace(/\[\[anim:([\w-]+):(\d+)(?:-(\d+))?\]\]/g,(m,id,sc,st)=>{jumps.push([id,+sc,st?+st:0]);return '';}).replace(/^\s*[*＊•-]\s*$/gm,'').replace(/^\s*(▶\s*)?看動畫[：:]\s*$/gm,'').replace(/\n{3,}/g,'\n\n').trim();
  box.innerHTML=esc(body).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^\s*\*\s+/gm,'• ');
  jumps.forEach(([id,sc,st])=>{const lab=jumpLabel(id,sc,st);if(!lab)return;const b=document.createElement('button');b.type='button';b.className='askjump';b.textContent=lab;
    b.addEventListener('click',()=>{if(id===ANIM_ID){$('bStart').hidden=true;goto(sc-1,Math.max(0,Math.min(scenes[sc-1].steps.length-1,(st||1)-1)));}else location.href=`../${id}/index.html#s${sc}-${st||1}`;});box.appendChild(b);});
  return box;}
async function ask(q){const log=$('askLog');const me=document.createElement('div');me.className='askmsg me';me.textContent=q;log.appendChild(me);
  const wait=document.createElement('div');wait.className='askmsg bot wait';wait.textContent='小港思考中…';log.appendChild(wait);log.scrollTop=log.scrollHeight;
  try{const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,anim:ANIM_ID})});
    const j=await r.json();wait.remove();if(!r.ok)throw new Error(j.message||('HTTP '+r.status));log.appendChild(renderAnswer(j.answer||''));}
  catch(e){wait.textContent='這一題沒有問成功：'+(e.message||e)+'。請稍後再試。';wait.classList.remove('wait');}
  log.scrollTop=log.scrollHeight;}
function openAsk(open){const d=$('askDrawer');d.classList.toggle('open',open);d.setAttribute('aria-hidden',open?'false':'true');if(open){setPlaying(false);setTimeout(()=>$('askInput').focus(),300);}}
$('askClose').addEventListener('click',()=>openAsk(false));
$('askForm').addEventListener('submit',e=>{e.preventDefault();const q=$('askInput').value.trim();if(!q)return;$('askInput').value='';ask(q);});
const TIPS=(window.__askTips||[]);TIPS.forEach(t=>{const b=document.createElement('button');b.type='button';b.textContent=t;b.addEventListener('click',()=>ask(t));$('askTips').appendChild(b);});
fetch('/api/config',{headers:{Accept:'application/json'}}).then(r=>r.ok?r.json():null).then(j=>{if(!j)throw 0;
  CLOUD=!HAS_REC;const sel=$('voiceSel');const keep=sel.value;addCloudOptions(sel);sel.value=(HAS_REC&&keep==='rec')?'rec':sel.options[0].value;voiceOn=true;$('bVoice').disabled=false;$('bVoice').textContent='🔊 語音：開';$('voiceNote').hidden=true;
  if(j.live&&!EMBED){const b=$('bAsk');b.hidden=false;b.addEventListener('click',()=>openAsk(!$('askDrawer').classList.contains('open')));}
}).catch(()=>{if(ASK_URL&&!EMBED){const b=$('bAsk');const a=document.createElement('a');a.className='askbtn';a.href=ASK_URL;a.target='_blank';a.rel='noopener';a.textContent='💬 問小港（另開網頁）';a.style.textDecoration='none';b.replaceWith(a);}});
/* ---------- 版面：把整個播放器（標題＋導覽＋舞台＋字幕＋控制列）塞進第一屏 ----------
   做法：舞台寬度 = min(容器寬, 可用高度 × 16/9)。「可用高度」不是猜的，而是設一個寬度、量實際排出來的高度、
   再修正寬度，重複幾次直到剛好貼齊可視區底部。視窗大小、全螢幕、字體載入、導覽列換行都會重算。
   字幕：字級跟著舞台寬度（舞台寬 / 36，桌面 22～32px；全螢幕上限 40px；手機與嵌入模式最小 18px），框的高度固定為 --sub-n 行。
   一行塞不下的長句，只有那一句會暫時縮字（最小 18px）。 */
const RT=document.documentElement,SUB_FLOOR=18,SUB_LH=1.45,SUB_PAD=16;
let fitting=false,fitQ=0,lastW=0,subBase=24,nBoost=0,mEl=null,mTxt=null;const mCache=new Map();
const TEXTS=scenes.flatMap(sc=>sc.steps.map(x=>x[0]));
/* 隱形的量尺：跟字幕框同樣的樣式，用來算「這個寬度、這個字級，最長的句子要幾行」 */
function measurer(){if(mEl)return mEl;mEl=document.createElement('div');mEl.className='subline';mEl.setAttribute('aria-hidden','true');
  mEl.style.cssText='position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;height:auto;overflow:visible;width:100px';
  mEl.innerHTML='<span class="who x">小芸</span><span></span>';mTxt=mEl.lastChild;$('subline').parentNode.appendChild(mEl);return mEl;}
function maxLines(w,fs){const k=w+'|'+fs;if(mCache.has(k))return mCache.get(k);const m=measurer();m.style.width=w+'px';m.style.fontSize=fs+'px';
  let n=1;for(const t of TEXTS){mTxt.textContent=t;n=Math.max(n,Math.round((m.offsetHeight-SUB_PAD)/(fs*SUB_LH)));}
  if(mCache.size>300)mCache.clear();mCache.set(k,n);return n;}
function fit(){
  if(fitting)return;fitting=true;
  try{
    const pl=$('player'),sb=pl.querySelector('.stagebox'),sub=pl.querySelector('.sub');if(!pl||!sb||!sub)return;
    const full=document.fullscreenElement===pl,embed=RT.classList.contains('embed'),cs=getComputedStyle(pl);
    const pT=full?parseFloat(cs.paddingTop)||0:0,pB=full?parseFloat(cs.paddingBottom)||0:0,pX=full?(parseFloat(cs.paddingLeft)||0)+(parseFloat(cs.paddingRight)||0):0;
    const maxW=Math.max(200,Math.floor(pl.clientWidth-pX)),minW=Math.min(maxW,400);   /* 矮到放不下時（例如手機橫放）寧可讓頁面捲動，也不要把舞台縮到看不清楚 */
    const vh=full?pl.clientHeight:window.innerHeight,tail=full?pB:6;
    const K=embed?44:36,fMin=(maxW<=640||embed)?18:22,fMax=full?40:(embed?26:32);
    const apply=w=>{const fs=Math.round(Math.min(fMax,Math.max(fMin,w/K)));
      RT.style.setProperty('--stage-w',w+'px');RT.style.setProperty('--sub-fs',fs+'px');
      RT.style.setProperty('--sub-n',Math.max(2,maxLines(w,SUB_FLOOR))+nBoost);subBase=fs;};
    const over=()=>{const a=sb.getBoundingClientRect(),b=sub.getBoundingClientRect();
      return (full?pT:a.top+window.scrollY)+(a.bottom-a.top)+(b.bottom-a.bottom)+tail-vh;};
    let w=Math.min(maxW,Math.max(minW,lastW||maxW)),o;
    for(let i=0;i<8;i++){apply(w);o=over();const t=Math.min(maxW,Math.max(minW,w-o*16/9));if(Math.abs(t-w)<1.5)break;w=Math.round(t);}
    for(let k=0;k<6&&o>0.5&&w>minW;k++){w=Math.max(minW,Math.floor(w-o*16/9)-1);apply(w);o=over();}   /* 保證不超出：寧可小一點點 */
    lastW=w;fitSubText();updateFade();
  }finally{fitting=false;}}
/* 這一句字幕塞進固定高度的框；塞不下就一次縮 1px，最多縮到 18px */
function fitSubText(){const sl=$('subline');if(!sl)return;let f=subBase;sl.style.setProperty('--sub-cur',f+'px');
  for(let g=0;g<40&&sl.scrollHeight>sl.clientHeight+1&&f>SUB_FLOOR;g++){f-=1;sl.style.setProperty('--sub-cur',f+'px');}
  if(sl.scrollHeight>sl.clientHeight+1&&nBoost<3){nBoost++;scheduleFit();}}   /* 量尺跟實際有落差時，多留一行 */
function scheduleFit(){if(fitQ)return;fitQ=requestAnimationFrame(()=>{fitQ=0;fit();});}
/* 章節膠囊太多放不下時：兩端淡出提示還有，滑鼠滾輪可以橫向滾 */
function updateFade(){const o=chips.scrollWidth>chips.clientWidth+1;chips.style.setProperty('--fl',o&&chips.scrollLeft>2?'22px':'0px');
  chips.style.setProperty('--fr',o&&chips.scrollLeft+chips.clientWidth<chips.scrollWidth-2?'22px':'0px');}
chips.addEventListener('scroll',updateFade,{passive:true});
chips.addEventListener('wheel',e=>{if(chips.scrollWidth<=chips.clientWidth+1||Math.abs(e.deltaY)<=Math.abs(e.deltaX))return;e.preventDefault();chips.scrollLeft+=e.deltaY;},{passive:false});
window.addEventListener('resize',()=>{nBoost=0;scheduleFit();});
document.addEventListener('fullscreenchange',()=>{nBoost=0;lastW=0;scheduleFit();setTimeout(scheduleFit,150);});
if(window.ResizeObserver){const ro=new ResizeObserver(scheduleFit);[document.querySelector('header.top'),$('steps'),$('chips'),document.querySelector('.sub')].forEach(e=>e&&ro.observe(e));}
if(document.fonts){const refit=()=>{mCache.clear();scheduleFit();};if(document.fonts.ready)document.fonts.ready.then(refit);if(document.fonts.addEventListener)document.fonts.addEventListener('loadingdone',refit);}
fit();
playing=false;{const h0=parseHash();goto(h0?h0[0]:0,h0?h0[1]:0);}
})();
</script>
